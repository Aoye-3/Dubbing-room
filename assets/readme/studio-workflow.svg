<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Dubbing-room dual-model studio workflow</title>
  <desc id="desc">VoxCPM2 creates reusable voice assets. Voice Library supplies speaker references to IndexTTS2, which performs dialogue and creates multiple takes. AppShell coordinates local runtime, jobs, history, and files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77766F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#238A88"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#F7F6F2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="52" y="54" font-size="15" font-weight="700" letter-spacing="2.5" fill="#8B6B21">THE SMALL DUBBING STUDIO</text>
    <text x="52" y="94" font-size="32" font-weight="800" fill="#202124">从声音资产，到最终 Take</text>
    <text x="1148" y="76" text-anchor="end" font-size="15" font-weight="700" fill="#77766F">本地文件 · 本地 runtime · 单 GPU 协调</text>

    <g id="voxcpm-stage">
      <rect x="52" y="132" width="284" height="198" rx="20" fill="#F0D78E"/>
      <text x="76" y="164" font-size="14" font-weight="800" letter-spacing="1.5" fill="#6E5315">STAGE 01 · VOICE MAKING</text>
      <text x="76" y="204" font-size="30" font-weight="850" fill="#202124">VoxCPM2</text>
      <text x="76" y="238" font-size="18" font-weight="700" fill="#51400F">声音设计 · 声音克隆</text>
      <rect x="76" y="264" width="112" height="38" rx="19" fill="#FCFBF8"/>
      <text x="132" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#5F470F">文本 + 提示</text>
      <rect x="198" y="264" width="114" height="38" rx="19" fill="#FCFBF8"/>
      <text x="255" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#5F470F">参考音频</text>
    </g>

    <path d="M336 230H378" stroke="#77766F" stroke-width="3" marker-end="url(#arrow)"/>

    <g id="voice-library">
      <rect x="392" y="156" width="190" height="150" rx="20" fill="#FCFBF8" stroke="#D8D5CB" stroke-width="2"/>
      <path d="M424 206C438 188 462 188 476 206C490 224 514 224 528 206" fill="none" stroke="#E3B23C" stroke-width="5" stroke-linecap="round"/>
      <text x="487" y="252" text-anchor="middle" font-size="22" font-weight="800" fill="#202124">Voice Library</text>
      <text x="487" y="279" text-anchor="middle" font-size="15" fill="#68675F">可复用说话人资产</text>
    </g>

    <path d="M582 230H624" stroke="#238A88" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <g id="indextts-stage">
      <rect x="638" y="132" width="284" height="198" rx="20" fill="#B9DDDA"/>
      <text x="662" y="164" font-size="14" font-weight="800" letter-spacing="1.5" fill="#155F5D">STAGE 02 · LINE PERFORMANCE</text>
      <text x="662" y="204" font-size="30" font-weight="850" fill="#202124">IndexTTS2</text>
      <text x="662" y="238" font-size="18" font-weight="700" fill="#155F5D">说话人参考 · 情绪控制</text>
      <rect x="662" y="264" width="112" height="38" rx="19" fill="#FCFBF8"/>
      <text x="718" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#155F5D">单句台词</text>
      <rect x="784" y="264" width="114" height="38" rx="19" fill="#FCFBF8"/>
      <text x="841" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#155F5D">多 Take</text>
    </g>

    <path d="M922 230H964" stroke="#77766F" stroke-width="3" marker-end="url(#arrow)"/>

    <g id="takes">
      <rect x="978" y="142" width="170" height="178" rx="20" fill="#202124"/>
      <text x="1000" y="173" font-size="14" font-weight="800" letter-spacing="1.5" fill="#B9DDDA">SELECT</text>
      <rect x="1000" y="192" width="42" height="40" rx="10" fill="#484945"/>
      <text x="1021" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#D8D5CB">01</text>
      <rect x="1052" y="192" width="42" height="40" rx="10" fill="#238A88"/>
      <text x="1073" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">02</text>
      <rect x="1104" y="192" width="22" height="40" rx="10" fill="#484945"/>
      <text x="1063" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">Selected Take</text>
      <text x="1063" y="296" text-anchor="middle" font-size="14" fill="#C7C6BF">History / output</text>
    </g>

    <path d="M194 330V372M487 306V372M780 330V372M1063 320V372" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="6 7"/>

    <g id="appshell-rail">
      <rect x="52" y="372" width="1096" height="102" rx="20" fill="#202124"/>
      <circle cx="80" cy="402" r="6" fill="#42A878"/>
      <text x="98" y="408" font-size="15" font-weight="800" letter-spacing="1.8" fill="#F7F6F2">ELECTRON APPSHELL / PYTHON BACKEND</text>

      <rect x="76" y="426" width="220" height="30" rx="15" fill="#343532"/>
      <text x="186" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#E3B23C">RuntimeCoordinator · GPU lease</text>
      <rect x="312" y="426" width="168" height="30" rx="15" fill="#343532"/>
      <text x="396" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F6F2">FIFO Jobs</text>
      <rect x="496" y="426" width="218" height="30" rx="15" fill="#343532"/>
      <text x="605" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F6F2">Voice Library · History</text>
      <rect x="730" y="426" width="394" height="30" rx="15" fill="#343532"/>
      <text x="927" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#B9DDDA">SQLite · checkpoints · cache · audio outputs</text>
    </g>
  </g>
</svg>
